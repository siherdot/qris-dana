services:
  qris:
    build: .
    container_name: dana-qris
    restart: unless-stopped
    ports:
      - "8090:3000"
    env_file:
      - .env
    volumes:
      - qris-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  qris-data:
